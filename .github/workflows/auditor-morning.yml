name: Auditor — ранковий аудит

on:
  schedule:
    # 06:00 UTC = 08:00 взимку / 09:00 влітку за Києвом.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: auditor-morning-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout clean-main
        uses: actions/checkout@v4
        with:
          ref: clean-main
          fetch-depth: 10

      - name: Run evidence-based audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUDITOR_ISSUE_NUMBER: "73"
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          issue_number_raw = os.environ.get("AUDITOR_ISSUE_NUMBER", "").strip()
          if not issue_number_raw.isdigit() or int(issue_number_raw) < 1:
              raise SystemExit(
                  "ERROR: AUDITOR_ISSUE_NUMBER must be a positive integer; "
                  f"received {issue_number_raw!r}."
              )
          issue_number = int(issue_number_raw)

          def request(url, method="GET", payload=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Authorization": "Bearer " + token,
              }
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")[:2000]
                  raise RuntimeError(
                      f"GitHub API request failed: {method} {url} "
                      f"returned HTTP {error.code}. Response: {details or '(empty body)'}"
                  ) from None
              except urllib.error.URLError as error:
                  raise RuntimeError(
                      f"GitHub API request failed: {method} {url}. Network error: {error.reason}"
                  ) from None

          def gh(path):
              url = f"{api}/repos/{repo}"
              if path:
                  url += f"/{path.lstrip('/')}"
              return request(url)

          # Issue #73 is the authoritative audit policy. Read its current body on every run.
          policy_issue = gh(f"issues/{issue_number}")
          policy_body = policy_issue.get("body") or ""
          required_policy_sections = [
              "## Призначення",
              "## Обов’язковий формат",
              "## Функціональні й дизайнерські ідеї",
              "## Межі повноважень",
          ]
          missing_policy = [section for section in required_policy_sections if section not in policy_body]
          if missing_policy:
              raise RuntimeError(
                  "Issue #73 audit policy is incomplete; missing sections: "
                  + ", ".join(missing_policy)
              )
          if "лише аналізує та радить" not in policy_body or "Telegram-повідомлення" not in policy_body:
              raise RuntimeError("Issue #73 is missing the Auditor authority or Telegram requirements.")

          issue_comments = gh(f"issues/{issue_number}/comments?per_page=100")
          marker = f"## Ранковий аудит — {today}"
          if any(marker in c.get("body", "") and c.get("user", {}).get("type") == "Bot"
                 for c in issue_comments):
              print(f"Report for {today} already exists; skipping duplicate.")
              raise SystemExit(0)

          issues_response = gh("issues?state=open&per_page=100")
          issues = [i for i in issues_response if "pull_request" not in i]
          issues.sort(key=lambda item: item.get("updated_at", ""), reverse=True)
          branches = gh("branches?per_page=100")
          commits = gh("commits?per_page=8")
          workflow_response = gh("actions/workflows?per_page=100")
          runs_response = gh("actions/runs?per_page=12")
          runs = runs_response.get("workflow_runs", [])
          default_branch = gh("")
          default_branch_name = default_branch.get("default_branch", "clean-main")

          latest_commit = commits[0] if commits else {}
          commit_message = latest_commit.get("commit", {}).get("message", "").splitlines()
          latest_sha = latest_commit.get("sha", "невідомо")
          latest_message = commit_message[0] if commit_message else "без повідомлення"
          latest_date = latest_commit.get("commit", {}).get("committer", {}).get("date", "невідомо")
          workflow_lines = []
          for run in runs[:8]:
              conclusion = run.get("conclusion") or run.get("status") or "невідомо"
              workflow_lines.append(
                  f"- [{run.get('name', 'Workflow')}]({run.get('html_url', '')}) — "
                  f"{conclusion}; гілка `{run.get('head_branch', '?')}`; "
                  f"{run.get('created_at', '?')}"
              )
          issue_lines = [
              f"- [#{i['number']} — {i['title']}]({i['html_url']}) — оновлено {i.get('updated_at', '?')}"
              for i in issues[:8]
          ]
          branch_names = [b.get("name", "") for b in branches]
          workflow_names = [
              f"`{w.get('name', w.get('path', 'workflow'))}` ({w.get('state', 'стан невідомий')})"
              for w in workflow_response.get("workflows", [])
          ]

          failed_runs = [run for run in runs if run.get("conclusion") == "failure"]
          active_issue = issues[0] if issues else None
          summary = (
              f"Останній коміт: {latest_sha[:7]} ({latest_message}); "
              f"відкритих задач: {len(issues)}; невдалих Actions: {len(failed_runs)}."
          )

          report = [
              "Auditor",
              "",
              f"## Ранковий аудит — {today}",
              "",
              f"**Короткий підсумок:** {summary}",
              "",
              "**Правила:** перед аудитом прочитано актуальний опис Issue #73; він використаний як джерело вимог до формату та повноважень Auditor.",
              "",
              "**Тип:** автоматичний аудит доказів GitHub; файли й робочий код не змінювалися.",
              "",
              "### Стан репозиторію",
              f"- Репозиторій: [`{repo}`](https://github.com/{repo}).",
              f"- Гілка за замовчуванням: `{default_branch_name}`.",
              f"- Гілок у відповіді GitHub API: **{len(branches)}**.",
              f"- Останній коміт: [`{latest_sha[:7]}`]({latest_commit.get('html_url', f'https://github.com/{repo}/commits/{default_branch_name}')}) — {latest_message} ({latest_date}).",
              f"- Workflow у відповіді GitHub API: {', '.join(workflow_names) if workflow_names else 'не отримано'}.",
              "",
              "### Активна задача та відкриті Issues",
              *([f"- Найсвіжіша активна задача за updated_at: [#{active_issue['number']} — {active_issue['title']}]({active_issue['html_url']})."] if active_issue else ["- Відкритих задач не знайдено у відповіді API."]),
              *(issue_lines or ["- Відкритих Issues не знайдено у відповіді API."]),
              "",
              "### Останні запуски GitHub Actions",
              *(workflow_lines or ["- Запуски не повернуто API; це не означає, що перевірки пройшли."]),
              "",
              "### Ризики та блокери",
              *( [f"- Є невдалі запуски Actions: {len(failed_runs)}; перевірити їхні логи перед висновком про справність CI."] if failed_runs else ["- Серед останніх повернутих запусків Actions немає статусу failure; це не гарантує відсутності інших проблем."] ),
              "- Аудит використовує факти, доступні через GitHub API; він не виконує локальний запуск тестів і не перевіряє вміст кожного документа.",
              "",
              "### Практичні ідеї",
              "- Нові UX/дизайн-ідеї додаються лише за наявності конкретного підтвердження в активних задачах, обговореннях або перевірених матеріалах; без доказів нові пропозиції не вигадуються.",
              "",
              "### Обмеження перевірки",
              "- Цей workflow формує звіт детерміновано з GitHub API; зовнішня модель та `OPENAI_API_KEY` не потрібні.",
              "- `npm test` та браузерні тести цим workflow не запускаються. Їхній стан можна оцінювати лише за відповідними CI-запусками вище.",
              "- Список гілок і Issues обмежений сторінкою API; це оперативний огляд, а не повний аудит кожного рядка коду.",
              "",
              "### Конкретні наступні кроки",
              *( [f"- Відкрити логи невдалих Actions: {', '.join(run.get('html_url', '') for run in failed_runs[:3])}."] if failed_runs else ["- Переглянути найактуальнішу відкриту задачу та відповідні перевірки перед прийняттям рішень."] ),
              "- Перевірити документацію, пов’язану з активною задачею, перш ніж рекомендувати зміни; у цьому автоматичному огляді вміст документації не сканується.",
              "",
              f"[Відкрити цей запуск Auditor]({os.environ['GITHUB_RUN_URL']})",
          ]
          body = "\n".join(report)
          if not body.startswith("Auditor\n\n" + marker):
              raise RuntimeError("Report role marker or date heading is invalid.")

          posted = request(
              f"{api}/repos/{repo}/issues/{issue_number}/comments",
              method="POST",
              payload={"body": body},
          )
          comment_url = posted.get("html_url", f"https://github.com/{repo}/issues/{issue_number}")
          print("Auditor report published: " + comment_url)

          bot = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not bot or not chat:
              print("WARNING: Telegram secrets missing; report published on GitHub only.")
              raise SystemExit(0)

          message = (
              f"🔎 Auditor — ранковий аудит {today}\n"
              f"Відкритих Issues: {len(issues)}; гілок: {len(branches)}\n"
              f"{comment_url}\n"
              f"Actions: {os.environ['GITHUB_RUN_URL']}"
          )
          form = urllib.parse.urlencode({
              "chat_id": chat,
              "text": message,
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot}/sendMessage",
              data=form,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              tg_result = json.loads(response.read().decode("utf-8"))
          if not tg_result.get("ok"):
              raise RuntimeError("Telegram API did not confirm delivery.")
          print("Telegram notification sent.")
          PY
