name: Telegram notifications

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send relevant comment to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          body = os.environ.get("COMMENT_BODY", "")
          lines = body.strip().splitlines()
          first_line = lines[0].strip() if lines else ""
          # Accept plain role prefixes and Markdown-emphasized forms such as **Dev-agent**.
          first_line = re.sub(r"^[*_`~]+|[*_`~]+$", "", first_line).strip()
          role_match = re.match(r"^(Tech-lead|Dev-agent|Auditor)(\s|$)", first_line, re.IGNORECASE)
          if not role_match:
              print("Comment has no recognized role prefix; skipped.")
              raise SystemExit(0)

          role = role_match.group(1)
          role_icons = {"Tech-lead": "🧭", "Dev-agent": "🛠", "Auditor": "🔎"}
          role_icon = next((icon for name, icon in role_icons.items() if name.lower() == role.lower()), "👤")
          title = os.environ.get("ISSUE_TITLE") or os.environ.get("PR_TITLE") or "GitHub"
          number = os.environ.get("ISSUE_NUMBER") or os.environ.get("PR_NUMBER") or "unknown"
          url = os.environ.get("COMMENT_URL", "")

          # Find the first Markdown heading before the horizontal separator.
          # This is the intended short description in Tech-lead/Dev-agent comments.
          content_lines = lines[1:]
          heading_lines = []
          for line in content_lines:
              if re.match(r"^\s*(?:-{3,}|_{3,}|\*{3,})\s*$", line):
                  break
              heading_lines.append(line)

          heading = next(
              (m.group(1).strip() for line in heading_lines
               if (m := re.match(r"^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$", line))),
              "",
          )
          if heading:
              # Render common Markdown inline syntax as readable Telegram text.
              summary = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", heading)
              summary = re.sub(r"[*_~`]", "", summary)
              summary = html.unescape(summary)
          else:
              # Backward-compatible fallback: use comment text before the separator.
              summary = re.sub(r"\s+", " ", " ".join(heading_lines)).strip()
              summary = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", summary)
              summary = re.sub(r"[*_~`]", "", summary)
              summary = html.unescape(summary)

          if not summary:
              summary = "Коментар без текстового опису."
          limit = 280
          if len(summary) > limit:
              summary = summary[:limit - 1].rstrip() + "…"

          message = (
              "<b>🔔 LyServer — новий коментар</b>\n\n"
              f"<b>Роль:</b> {role_icon} {html.escape(role)}\n"
              f"<b>Обговорення:</b> #{html.escape(number)}\n"
              f"<b>Тема:</b> {html.escape(title)}\n"
              f"<b>Коротко:</b> {html.escape(summary)}\n\n"
              f'<a href="{html.escape(url, quote=True)}">↗ Відкрити коментар на GitHub</a>'
          )

          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API did not confirm message delivery.")
          print("Telegram notification sent successfully.")
          PY
