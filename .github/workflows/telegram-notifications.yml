name: Telegram notifications

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send relevant comment to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          body = os.environ.get("COMMENT_BODY", "")
          first_line = body.splitlines()[0] if body.splitlines() else ""
          if not re.match(r"^\s*(Tech-lead|Dev-agent)(\s|$)", first_line, re.IGNORECASE):
              print("Comment has no recognized role prefix; skipped.")
              raise SystemExit(0)

          author = os.environ.get("COMMENT_AUTHOR", "unknown")
          title = os.environ.get("ISSUE_TITLE") or os.environ.get("PR_TITLE") or "GitHub"
          number = os.environ.get("ISSUE_NUMBER") or os.environ.get("PR_NUMBER") or "unknown"
          comment_id = os.environ.get("COMMENT_ID", "")
          url = os.environ.get("COMMENT_URL", "")

          message = (
              "<b>🔔 LyServer — новий коментар</b>\n\n"
              f"<b>Роль:</b> {html.escape(first_line)}\n"
              f"<b>Автор:</b> {html.escape(author)}\n"
              f"<b>Обговорення:</b> #{html.escape(number)}\n"
              f"<b>Тема:</b> {html.escape(title)}\n"
              f"<b>ID коментаря:</b> {html.escape(comment_id)}\n\n"
              f'<a href="{html.escape(url, quote=True)}">↗ Відкрити коментар на GitHub</a>'
          )

          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API did not confirm message delivery.")
          print("Telegram notification sent successfully.")
          PY
